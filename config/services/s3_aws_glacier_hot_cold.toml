# AWS S3 Glacier / Deep Archive as cold storage, with a hot repository for metadata.
#
# `data_storage_class` is the rustic Glacier write option: only data packs are
# archived. Keys, config, snapshots, index, and tree packs stay Standard on
# cold (and are also written to --repo-hot). Do not set OpenDAL
# `default_storage_class` on [repository.options] — that archives metadata too.
#
# Daily commands (backup, snapshots, ls, forget) read the hot side and do not
# call RestoreObject. restore / check --read-data / prune-repack use native
# RestoreObject when enable_restore is true.
#
# Init:    rustic -P s3_aws_glacier_hot_cold init
# Backup:  rustic -P s3_aws_glacier_hot_cold backup
# Restore: rustic -P s3_aws_glacier_hot_cold warmup latest
#          rustic -P s3_aws_glacier_hot_cold warmup --status latest
#          rustic -P s3_aws_glacier_hot_cold restore latest /tmp/out
#
# IAM on the cold bucket: s3:GetObject, s3:PutObject, s3:DeleteObject,
# s3:ListBucket, s3:HeadObject, s3:RestoreObject.
#
# Glacier Instant Retrieval: data_storage_class = "GLACIER_IR" — GET is
# immediate; omit enable_restore / warm-up-wait.
# Deep Archive Bulk restore can take 48h; GLACIER Standard is typically hours.

[repository]
repository = "opendal:s3"
repo-hot = "/var/lib/rustic-hot"
# Poll deadline for native RestoreObject (also used as sleep if you switch to
# warm-up-command). 12h for GLACIER Standard, 48h for DEEP_ARCHIVE Bulk.
warm-up-wait = "48h"

[repository.options]
bucket = "my-glacier"
root = "/repo"
region = "eu-central-1"
# credentials: AWS env / profile, or:
# access_key_id = "xxx"
# secret_access_key = "xxx"

# Data packs only. GLACIER, DEEP_ARCHIVE, or GLACIER_IR.
data_storage_class = "DEEP_ARCHIVE"
# Native RestoreObject + HeadObject status (needs static keys, not SSO).
enable_restore = "true"
restore_days = "7"
restore_tier = "Standard"

# SSO / assume-role: set enable_restore = "false" and use:
# warm-up-command = "aws s3api restore-object --bucket my-glacier --key %path --restore-request Days=7,GlacierJobParameters={Tier=Standard}"
# warm-up-batch = 20

[forget]
keep-daily = 8
keep-weekly = 5
keep-monthly = 13
keep-yearly = 10
prune = true

# Prune with --repo-hot or data_storage_class already skips rewriting mixed
# data packs (repack-cacheable-only defaults to true). Fully unused data packs
# are still deleted. Pass --keep-pack 90d (GLACIER / GLACIER_IR) or 180d
# (DEEP_ARCHIVE) on forget --prune / prune to avoid AWS early-delete fees:
#   rustic -P s3_aws_glacier_hot_cold forget --prune --keep-pack 180d
