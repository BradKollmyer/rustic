# rustic config for a native Storj Uplink repository.
#
# Native uplink encrypts and erasure-codes on the client (~2.68× upload vs S3).
# Restores talk to storage nodes directly (no hosted gateway).
#
# Prefer access-file or STORJ_ACCESS over putting the grant in this file.
# Do not mix this backend with opendal:s3 on the same bucket prefix.
#
# Pack size ~60 MiB matches Storj's 64 MiB segment size (restic's Storj guide).

[repository]
repository = "storj:bucket-name/rustic-repo"
password = "password"

[repository.options]
access-file = "/root/storj.grant"
# access-command = "cat /root/storj.grant"
# retry = "default"
# transport = "noise" # tcp, quic, auto, or noise. Default: noise (restic/Go uplink)
# connections = "5" # Concurrent object reads/writes; each fans out to storage nodes.
# message-timeout = "20" # Seconds per network read/write, including stalled peers.
# download-hedge-delay = "1" # Seconds without a completed piece before trying another node; 0 disables.
# Downloads start k+1 pieces and cap speculative spares at about 20% of k
# (normally up to 35 pieces for k=29). Slow pieces continue until k succeed.

# Applied at `rustic init`. 60 MiB sits near Storj's 64 MiB segment size.
[init]
set-datapack-size = "60 MiB"
set-datapack-size-limit = "60 MiB"
